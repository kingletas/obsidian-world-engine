name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: make check (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20.x", "22.x"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # `npm ci` installs exactly what the lockfile says and fails when it disagrees with package.json.
      - name: Install dependencies
        run: npm ci

      - name: Build and test
        run: make check

      # The suite doesn't compare these files, and Obsidian trusts only the manifest's version.
      - name: Check the manifest agrees with package.json and versions.json
        run: |
          node -e '
            const fs = require("fs");
            const manifest = JSON.parse(fs.readFileSync("manifest.json", "utf8"));
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const versions = JSON.parse(fs.readFileSync("versions.json", "utf8"));
            for (const key of ["id", "name", "version", "minAppVersion", "description"]) {
              if (!manifest[key]) throw new Error(`manifest.json is missing ${key}`);
            }
            if (manifest.version !== pkg.version) {
              throw new Error(`manifest ${manifest.version} != package.json ${pkg.version}`);
            }
            if (versions[manifest.version] !== manifest.minAppVersion) {
              throw new Error(`versions.json has no "${manifest.version}": "${manifest.minAppVersion}" entry`);
            }
            console.log(`${manifest.id} ${manifest.version} ok`);
          '
